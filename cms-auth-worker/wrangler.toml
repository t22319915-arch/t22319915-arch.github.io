# Cloudflare Worker 部署設定（Decap CMS GitHub OAuth 授權代理）
# 用法：npx wrangler login（只需做一次）→ npx wrangler deploy
# 注意：以下設定需與 Cloudflare Dashboard 上的遠端設定保持一致，
# 部署時會以此檔覆蓋遠端，隨意刪減可能改變 Worker 行為。
name = "church-cms-auth"
main = "worker.js"
compatibility_date = "2026-09-08"
preview_urls = false

[observability.logs]
enabled = true
